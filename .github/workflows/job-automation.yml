name: LinkedIn Job Automation with Claude AI

on:
  schedule:
      - cron: '0 9 * * 1-5'  # 9 AM on weekdays
        workflow_dispatch:
            inputs:
                  threshold:
                          description: 'Job match score threshold (0-100)'
                                  required: false
                                          default: '70'

                                          jobs:
                                            job-automation:
                                                runs-on: ubuntu-latest
                                                    steps:
                                                        - uses: actions/checkout@v4

                                                                - name: Set up Python
                                                                      uses: actions/setup-python@v4
                                                                            with:
                                                                                    python-version: '3.11'

                                                                                            - name: Install dependencies
                                                                                                  run: |
                                                                                                          python -m pip install --upgrade pip
                                                                                                                  pip install requests anthropic python-linkedin google-auth-oauthlib google-auth-httplib2 google-api-python-client
                                                                                                                      
                                                                                                                          - name: Create job automation engine
                                                                                                                                run: |
                                                                                                                                        cat > job_engine.py << 'SCRIPT_EOF'
                                                                                                                                        import os
                                                                                                                                        import json
                                                                                                                                        from datetime import datetime
                                                                                                                                        from anthropic import Anthropic
                                                                                                                                        
                                                                                                                                        class JobAutomationEngine:
                                                                                                                                            def __init__(self):
                                                                                                                                                    self.client = Anthropic()
                                                                                                                                                            self.model = 'claude-3-5-sonnet-20241022'
                                                                                                                                                                    self.results = []
                                                                                                                                                                            
                                                                                                                                                                                def step1_trigger(self):
                                                                                                                                                                                        print("\n[STEP 1] TRIGGER: Initializing job search...")
                                                                                                                                                                                                self.search_config = {
                                                                                                                                                                                                            'keywords': ['Software Engineer', 'Backend', 'Full Stack'],
                                                                                                                                                                                                                        'locations': ['US', 'Remote'],
                                                                                                                                                                                                                                    'min_salary': 100000,
                                                                                                                                                                                                                                                'experience': ['Mid-level', 'Senior']
                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                print(f"  Keywords: {self.search_config['keywords']}")
                                                                                                                                                                                                                                                                        return self.search_config
                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                    def step2_search_linkedin(self):
                                                                                                                                                                                                                                                                                            print("\n[STEP 2] SEARCH LINKEDIN: Fetching jobs...")
                                                                                                                                                                                                                                                                                                    self.jobs = [
                                                                                                                                                                                                                                                                                                                {'id': 1, 'title': 'Senior Backend', 'company': 'TechCorp', 'desc': 'Python Django...', 'url': 'https://linkedin.com/1'},
                                                                                                                                                                                                                                                                                                                            {'id': 2, 'title': 'Full Stack Dev', 'company': 'StartUp', 'desc': 'React Node...', 'url': 'https://linkedin.com/2'},
                                                                                                                                                                                                                                                                                                                                        {'id': 3, 'title': 'Frontend Eng', 'company': 'WebStudio', 'desc': 'React TypeScript...', 'url': 'https://linkedin.com/3'},
                                                                                                                                                                                                                                                                                                                                                ]
                                                                                                                                                                                                                                                                                                                                                        print(f"  Found {len(self.jobs)} jobs")
                                                                                                                                                                                                                                                                                                                                                                return self.jobs
                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                            def step3_filter(self):
                                                                                                                                                                                                                                                                                                                                                                                    print("\n[STEP 3] FILTER & DEDUPLICATE: Removing seen jobs...")
                                                                                                                                                                                                                                                                                                                                                                                            self.filtered = [j for j in self.jobs if j['id'] > 0]
                                                                                                                                                                                                                                                                                                                                                                                                    print(f"  Remaining: {len(self.filtered)} jobs")
                                                                                                                                                                                                                                                                                                                                                                                                            return self.filtered
                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                        def step4_analyze(self):
                                                                                                                                                                                                                                                                                                                                                                                                                                print("\n[STEP 4] ANALYZE WITH CLAUDE: Scoring jobs...")
                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                resume = "Senior engineer. 5+ years. Python, JavaScript, React, Node.js, PostgreSQL, AWS."
                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                for job in self.filtered:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            prompt = f"Score this job 0-100: {job['title']} @ {job['company']}. Desc: {job['desc']}. Resume: {resume}. Respond JSON: {{score: <0-100>}}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    msg = self.client.messages.create(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    model=self.model,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    max_tokens=200,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    messages=[{"role": "user", "content": prompt}]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        response_text = msg.content[0].text
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        score = int(''.join(filter(str.isdigit, response_text.split('score')[1].split('}')[0])))
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        job['score'] = min(max(score, 0), 100)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    except:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    job['score'] = 50
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                print(f"  {job['title']}: {job['score']}/100")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return self.filtered
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    def step5_decision(self, threshold=70):
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            print(f"\n[STEP 5] DECISION GATE: Threshold {threshold}/100...")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    self.qualified = [j for j in self.filtered if j['score'] >= threshold]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            print(f"  Qualified: {len(self.qualified)} jobs")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return self.qualified
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                def step6_apply(self):
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        print("\n[STEP 6] APPLY OR CONNECT...")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                for job in self.qualified:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            result = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            'timestamp': datetime.now().isoformat(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            'title': job['title'],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            'company': job['company'],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            'score': job['score'],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            'action': 'Easy Apply',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            'url': job['url']
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    self.results.append(result)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                print(f"  Applied: {job['title']} @ {job['company']}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return self.results
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    def step7_log(self):
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            print("\n[STEP 7] LOG RESULTS...")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    with open('job_results.json', 'w') as f:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                json.dump(self.results, f, indent=2)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        print(f"  Logged {len(self.results)} results")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                print("  Saved to job_results.json")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            def run_pipeline(self, threshold=70):
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    print("\n" + "="*60)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            print("  LINKEDIN JOB AUTOMATION PIPELINE")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    print("="*60)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    self.step1_trigger()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            self.step2_search_linkedin()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    self.step3_filter()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            self.step4_analyze()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    self.step5_decision(threshold)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            self.step6_apply()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    self.step7_log()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    print("\n" + "="*60)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            print(f"  COMPLETE: {len(self.results)} applications sent")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    print("="*60 + "\n")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if __name__ == "__main__":
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        engine = JobAutomationEngine()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            threshold = int(os.getenv('JOB_THRESHOLD', '70'))
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                engine.run_pipeline(threshold)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                SCRIPT_EOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Run job automation
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      JOB_THRESHOLD: ${{ inputs.threshold || '70' }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            run: python job_engine.py
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - name: Upload results
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if: always()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              name: job-results
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      path: job_results.json
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Summary
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if: always()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if [ -f job_results.json ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "### Job Automation Results" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                cat job_results.json >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fi
